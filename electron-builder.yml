appId: com.lumos.app
productName: Lumos
# Two providers in priority order:
#   1. generic (lumos-web /api/updates) — checked first by electron-updater at
#      runtime, mirrors are usually faster + reachable from regions where
#      GitHub is rate-limited or blocked
#   2. github — keeps `electron-builder --publish always` uploading installer
#      bytes to GitHub Releases at build time so lumos-web can sync them, and
#      provides a fallback if the official mirror is down
# To migrate the official URL: update both this file and feedback_website_url.md.
publish:
  - provider: generic
    url: https://lumos.miki.zj.cn/api/updates
    channel: latest
  - provider: github
    owner: zhangjunjesse
    repo: Lumos
directories:
  output: release
files:
  - dist-electron/**/*
  - "!node_modules"
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/prebuild-install/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/esbuild/**/*
  - node_modules/@esbuild/**/*
  - "!src"
  - "!electron"
  - "!.next"
  - "!build"
  - "!scripts"
  - "!docs"
  - "!release"
  - "!data"
extraResources:
  - from: .next/standalone/
    to: standalone/
    filter:
      - "**/*"
      - "!node_modules"
      - "!.next"
      - "!release"
      - "!resources"
      - "!src"
      - "!dist-electron"
      - "!design"
      - "!build"
      - "!docs"
      - "!electron"
      - "!scripts"
      - "!tests"
      - "!test-screenshots"
      - "!requirements"
      - "!evaluations"
      - "!deepsearch-content"
      - "!tasks"
      - "!poc"
      - "!.claude"
      - "!.lumos-uploads"
  - from: .next/standalone/node_modules/
    to: standalone/node_modules/
    filter: ["**/*"]
  - from: .next/standalone/.next/
    to: standalone/.next/
    filter: ["**/*"]
  - from: .next/static/
    to: standalone/.next/static/
    filter: ["**/*"]
  - from: public/
    to: standalone/public/
    filter: ["**/*"]
  - from: resources/mcp-servers/
    to: mcp-servers/
    filter: ["**/*"]
  - from: resources/app-schemas/
    to: standalone/resources/app-schemas/
    filter: ["**/*"]
  - from: resources/models/
    to: models/
    filter: ["**/*"]
  - from: resources/models/
    to: standalone/resources/models/
    filter: ["**/*"]
  - from: build/
    to: .
    filter: ["icon.*"]
  - from: resources/feishu-mcp-server/
    to: feishu-mcp-server/
    filter: ["**/*"]
  - from: node_modules/@anthropic-ai/claude-agent-sdk/
    to: standalone/node_modules/@anthropic-ai/claude-agent-sdk/
    filter: ["**/*"]
  - from: resources/node-runtime/
    to: node-runtime/
    filter: ["**/*"]
  - from: resources/python-runtime/
    to: python-runtime/
    filter: ["**/*"]
  - from: resources/git-bash/
    to: git-bash/
    filter: ["**/*"]
afterPack: scripts/after-pack-ensure-models.js
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"
  - "**/esbuild/**"
  - "**/@esbuild/**"
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  artifactName: "${productName}-${version}-${arch}.${ext}"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  icon: build/icon.ico
  # No spaces — keeps electron-builder's GitHub publisher and the workflow's
  # subsequent `gh release upload` from producing two distinctly-named copies
  # (`Lumos Setup ${version}.exe` vs. `Lumos.Setup.${version}.exe` after the
  # actions/upload-artifact roundtrip).
  artifactName: "${productName}-Setup-${version}.${ext}"
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
