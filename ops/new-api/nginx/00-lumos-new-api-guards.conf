# HTTP-context guards for api.miki.zj.cn.
# This file is included by nginx.conf via /etc/nginx/conf.d/*.conf.

log_format lumos_new_api
  '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time '
  'ua="$http_user_agent" xff="$http_x_forwarded_for" '
  'module="$http_x_lumos_module" operation="$http_x_lumos_operation" '
  'session="$http_x_lumos_session_id" run="$http_x_lumos_run_id" '
  'stage="$http_x_lumos_stage_id" request_id="$upstream_http_x_oneapi_request_id"';

limit_req_zone $binary_remote_addr zone=lumos_new_api_v1_ip:20m rate=180r/m;
limit_req_zone $binary_remote_addr zone=lumos_new_api_panel_ip:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=lumos_new_api_login_ip:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=lumos_new_api_web_ip:10m rate=300r/m;
